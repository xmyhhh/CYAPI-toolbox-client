<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#193d33" />
    <meta name="description" content="CYAPI Toolbox，本地优先的 AI 工具箱。" />
    <title>CYAPI Toolbox · Skill 工作台</title>
    <script>
      // Apply the saved appearance before the first paint, so the window never
      // flashes the wrong colours.
      try {
        var stored = localStorage.getItem('cyapi-toolbox.theme.v1');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
