name: Release

# Builds the desktop installers and portable copies and attaches them to a
# GitHub release. Tags must match the source version, e.g. v1.1.0.
#
# - Windows: NSIS installer + portable EXE
# - macOS: DMG + portable ZIP, for both Apple Silicon and Intel (the Intel
#   build cross-compiles so the pipeline does not depend on retired
#   Intel runner images)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 (NSIS + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify the tag matches the source version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match source v$version"
            exit 1
          fi

      - name: Run the frontend tests
        run: npm test

      - name: Build the NSIS installer and the portable EXE
        run: npm run desktop:build

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/CYAPI-Toolbox_*.exe
          if-no-files-found: error

  macos:
    name: macOS (DMG + portable, arm64 and x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the Rust toolchain and the Intel target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify the tag matches the source version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match source v$version"
            exit 1
          fi

      - name: Run the frontend tests
        run: npm test

      - name: Build Apple Silicon
        run: npm run desktop:build:macos

      - name: Mark Apple Silicon artifacts
        run: |
          version=$(node -p "require('./package.json').version")
          mv "release/CYAPI-Toolbox_${version}-macos.dmg" "release/CYAPI-Toolbox_${version}-macos-arm64.dmg"
          mv "release/CYAPI-Toolbox_${version}-macos.zip" "release/CYAPI-Toolbox_${version}-macos-arm64.zip"

      - name: Build Intel
        run: node scripts/run.mjs desktop build --target x86_64-apple-darwin

      - name: Collect and mark Intel artifacts
        run: |
          version=$(node -p "require('./package.json').version")
          rm -rf src-tauri/target/release
          mkdir -p src-tauri/target/release/bundle
          cp -R src-tauri/target/x86_64-apple-darwin/release/bundle/. src-tauri/target/release/bundle/
          cp src-tauri/target/x86_64-apple-darwin/release/cyapi-toolbox src-tauri/target/release/cyapi-toolbox
          sh scripts/collect-release.sh
          mv "release/CYAPI-Toolbox_${version}-macos.dmg" "release/CYAPI-Toolbox_${version}-macos-x64.dmg"
          mv "release/CYAPI-Toolbox_${version}-macos.zip" "release/CYAPI-Toolbox_${version}-macos-x64.zip"

      - name: Upload the macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            release/CYAPI-Toolbox_*.dmg
            release/CYAPI-Toolbox_*.zip
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-input

      - name: Attach the artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-input/windows-exe/CYAPI-Toolbox_*.exe
            release-input/macos-packages/CYAPI-Toolbox_*.dmg
            release-input/macos-packages/CYAPI-Toolbox_*.zip
